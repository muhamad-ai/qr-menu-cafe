<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Menu Items — Admin Dashboard</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar">
        <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle menu">☰</button>
        <h1>Menu Items</h1>
        <div></div>
      </header>

      <div class="page">
        <div class="panel">
          <div class="panel__header">
            <h2>All items</h2>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <select id="filterCategory" class="field" style="padding:8px 10px;border:1px solid var(--a-border);border-radius:8px;">
                <option value="all">All categories</option>
              </select>
              <button type="button" class="btn" id="addItemBtn">+ Add item</button>
            </div>
          </div>
          <div id="itemsList" class="data-list"></div>
          <div id="itemsEmpty" class="empty-state" hidden>No items yet. Add your first one.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit modal -->
  <div class="modal-backdrop" id="itemModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="itemModalTitle">
      <h2 id="itemModalTitle">Add item</h2>
      <form id="itemForm" novalidate>
        <input type="hidden" id="itemId" />

        <div class="field">
          <label for="itemCategory">Category *</label>
          <select id="itemCategory" required></select>
          <div class="field-error" id="itemCategoryError"></div>
        </div>

        <div class="field">
          <label for="itemNameKu">Name (Kurdish) *</label>
          <input type="text" id="itemNameKu" required />
          <div class="field-error" id="itemNameKuError"></div>
        </div>
        <div class="field">
          <label for="itemNameAr">Name (Arabic)</label>
          <input type="text" id="itemNameAr" />
        </div>
        <div class="field">
          <label for="itemNameEn">Name (English)</label>
          <input type="text" id="itemNameEn" />
        </div>

        <div class="field">
          <label for="itemDescKu">Description (Kurdish)</label>
          <textarea id="itemDescKu" rows="2"></textarea>
        </div>
        <div class="field">
          <label for="itemDescAr">Description (Arabic)</label>
          <textarea id="itemDescAr" rows="2"></textarea>
        </div>
        <div class="field">
          <label for="itemDescEn">Description (English)</label>
          <textarea id="itemDescEn" rows="2"></textarea>
        </div>

        <div class="field">
          <label for="itemPrice">Price *</label>
          <input type="number" id="itemPrice" min="0" step="0.01" required />
          <div class="field-error" id="itemPriceError"></div>
        </div>

        <div class="field">
          <label for="itemImage">Photo</label>
          <input type="file" id="itemImage" accept="image/*" />
          <img id="itemImagePreview" class="image-preview" hidden alt="Preview" />
        </div>

        <div class="field">
          <label><input type="checkbox" id="itemAvailable" checked /> Available</label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="itemCancelBtn">Cancel</button>
          <button type="submit" class="btn" id="itemSaveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/supabaseClient.js" defer></script>
  <script src="../assets/js/admin-common.js" defer></script>
  <script src="../assets/js/admin-items.js" defer></script>
</body>
</html>
