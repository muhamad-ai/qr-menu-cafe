<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>چوونەژوورەوە — بەڕێوەبردنی مێنیو</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Admin Dashboard</h1>
    <p class="subtitle">بۆ بەڕێوەبردنی مێنیوی کافێکەت، چوونەژوورەوە بکە.</p>

    <div id="loginError" class="login-error" role="alert" hidden></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">ئیمەیل</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">تێپەڕەوشە</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" id="loginSubmit" class="btn btn-block">چوونەژوورەوە</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/supabaseClient.js" defer></script>
  <script src="../assets/js/admin-auth.js" defer></script>
</body>
</html>
